spring.application.name=auth-service
server.port=8081
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=259200000
internal.api-key=${INTERNAL_API_KEY}

user.service.url=http://localhost:8082
spring.cloud.openfeign.client.config.user-service.connect-timeout=2000
spring.cloud.openfeign.client.config.user-service.read-timeout=3000

security.rutas-publicas=/api/v1/auth/**,/actuator/**,/error,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
security.cors-origenes=http://localhost:5173
spring.web.error.include-message=always

springdoc.api-title=Auth Service API
springdoc.api-description=Autenticación y emisión de JWT