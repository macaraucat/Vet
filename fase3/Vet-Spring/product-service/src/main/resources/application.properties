spring.application.name=product-service
server.port=8083

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DB_URL}/vet_productos?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=259200000

spring.web.error.include-message=always

#deja el catálogo abierto 
security.rutas-publicas=/api/v1/productos/**,/api/v1/categorias/**,/api/v1/boletas/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**
security.cors-origenes=${CORS_ORIGINS:http://localhost:5173}

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha