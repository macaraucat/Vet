server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:5173"
                allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
                allowed-headers: "Authorization,Content-Type"
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            # ---------- Rutas de negocio ----------
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/users,/api/v1/users/me,/api/v1/users/{id:[0-9]+}

            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/productos/**,/api/categorias/**,/api/boletas/**

            # ---------- Rutas para el Swagger UI agregado ----------
            - id: auth-docs
              uri: http://localhost:8081
              predicates:
                - Path=/auth/v3/api-docs
              filters:
                - StripPrefix=1

            - id: users-docs
              uri: http://localhost:8082
              predicates:
                - Path=/users/v3/api-docs
              filters:
                - StripPrefix=1

            - id: productos-docs
              uri: http://localhost:8083
              predicates:
                - Path=/productos/v3/api-docs
              filters:
                - StripPrefix=1

# ---------- SpringDoc (Swagger UI agregado) ----------
springdoc:
  swagger-ui:
    urls:
      - name: auth
        url: /auth/v3/api-docs
      - name: users
        url: /users/v3/api-docs
      - name: productos
        url: /productos/v3/api-docs