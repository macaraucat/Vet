spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10s

# Rutas para auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**,/login,/logout
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# Rutas para user-service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/admin/**,/users/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# Rutas para product-service
spring.cloud.gateway.routes[2].id=product-service
spring.cloud.gateway.routes[2].uri=lb://product-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/products/**,/product/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1