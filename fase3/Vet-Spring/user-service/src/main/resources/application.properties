spring.application.name=user-service
server.port=8082
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=259200000
internal.api-key=${INTERNAL_API_KEY}

security.rutas-publicas=/api/v1/users/internal/**,/actuator/**,/error,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
security.cors-origenes=${CORS_ORIGINS:http://localhost:5173}

spring.datasource.url=${DB_URL}/vet_usuarios?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.api-title=User Service API
springdoc.api-description=Gestión de usuarios
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha