<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="header">
            <div>
                <a href="index.html"><img src="img/logo-fondo-blanco.png" alt="Logo Veterinaria San Marcos" class="logo"></a>                
                <nav>
                    <a href="catalogo.html">Productos</a>
                    <a href="#nosotros">Nosotros</a>
                    <a href="#blogs">Blogs</a>
                    <a href="contacto.html">Contacto</a>
                </nav>
            </div>
            <div>
                <span id="user-name-display" class="user-name"></span>
                <a href="login.html" title="Iniciar sesión"><img src="img/cuenta.svg" alt="Iniciar sesión" class="icon"></a>
                <a href="carrito.html" title="Carrito" class="position-relative">
                    <img src="img/carrito.svg" alt="Carrito" class="icon">
                    <span id="contador-carrito" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle">0</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section id="contacto" class="contacto py-3">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="card shadow-sm border">
                            <div class="card-body p-4 p-md-4">
                                <h2 class="card-title text-center mb-3">Contacte con nosotros</h2>

                                <form>
                                    <div class="mb-3">
                                        <label for="asunto" class="form-label"><b>Asunto</b></label>
                                        <input type="text" class="form-control" id="asunto" name="asunto" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="email" class="form-label"><b>Correo electrónico</b></label>
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Ingresar correo electrónico" required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="archivo" class="form-label"><b>Archivo adjunto (opcional) </b></label>
                                        <input type="file" class="form-control" id="archivo" name="archivo" accept="image/*">
                                    </div>

                                    <div class="mb-4">
                                        <label for="mensaje" class="form-label"><b>Mensaje</b></label>
                                        <textarea class="form-control" id="mensaje" name="mensaje" rows="4" placeholder="¿Cómo podemos ayudarle?" required></textarea>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-success">Enviar</button>
                                    </div>
                                    <p class="text-center mt-3 mb-0">Respondemos en un plazo de 24 horas</p>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer py-3"><p>© Veterinaria San Marcos 2026. Todos los derechos reservados.</p></footer>

    <script src="js/auth.js"></script>

</body>
</html>
