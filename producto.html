<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Producto | Veterinaria San Marcos</title>
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tienda.css">
</head>
<body>

    <div id="aviso-toast" class="alert alert-success text-center d-none"></div>

    <header class="py-3">
        <div class="container">
            <div class="header d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <a href="index.html"><img src="img/logo.png" alt="Logo Veterinaria San Marcos" class="logo"></a>
                    <nav class="d-flex align-items-center gap-3">
                        <a href="catalogo.html">Productos</a>
                        <a href="index.html#nosotros">Nosotros</a>
                        <a href="index.html#blogs">Blogs</a>
                        <a href="index.html#contacto">Contacto</a>
                    </nav>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span id="user-name-display" class="user-name"></span>
                    <a href="login.html" id="btn-login" title="Iniciar sesión"><img src="img/cuenta.svg" alt="Iniciar sesión" class="icon"></a>
                    <a href="#" id="btn-logout" title="Cerrar sesión" style="display: none;"><img src="img/logout.svg" alt="Cerrar sesión" class="icon"></a>
                    <a href="carrito.html" title="Carrito" class="position-relative">
                        <img src="img/carrito.svg" alt="Carrito" class="icon">
                        <span id="contador-carrito" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="row g-2 align-items-start">
            <div class="col-12 col-md-5">
                <img src="img/ME001.jpeg" alt="Amoxibay 250mg" class="img-fluid rounded shadow-sm">
            </div>
            <div class="col-12 col-md-7">
                <span class="badge bg-secondary mb-2">Antibióticos</span>
                <h2>Amoxibay 250mg</h2>
                <p class="fs-4 fw-bold">$4.200</p>
                <ul class="list-unstyled">
                    <li><strong>Principio activo:</strong> Amoxicilina</li>
                    <li><strong>Presentación:</strong> Blíster 10 comp.</li>
                    <li><strong>Especie:</strong> Perro / Gato</li>
                </ul>
                <div class="d-flex gap-2 mt-3">
                    <button class="btn btn-success" onclick="agregarAlCarrito('ME001', 'Amoxibay 250mg', 4200, 'img/ME001.jpeg')">Agregar al carrito</button>
                    <a href="catalogo.html" class="btn btn-outline-secondary">Volver al catálogo</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer py-3">
        <div class="container">
            <p class="text-center">© Veterinaria San Marcos 2026. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/producto.js"></script>

</body>
</html>
