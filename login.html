<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos</title>
    <link rel="icon" type="image/x-icon" href="img/logo-fondo-blanco.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <div class="header">
            <div>
                <a href="index.html"><img src="img/logo-fondo-blanco.png" alt="Logo Veterinaria San Marcos" class="logo"></a>                
                <nav>
                    <a href="catalogo.html">Productos</a>
                    <a href="#nosotros">Nosotros</a>
                    <a href="#blogs">Blogs</a>
                    <a href="contacto.html">Contacto</a>
                </nav>
            </div>
            <div>
                <a href="login.html" title="Iniciar sesión"><img src="img/cuenta.svg" alt="Iniciar sesión" class="icon"></a>
                <img src="img/carrito.svg" alt="Carrito" class="icon">
            </div>
        </div>
    </header>

    <main>
        <section id="login" class="login py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="card shadow-sm border">
                            <div class="card-body p-4 p-md-5">
                                <h2 class="card-title text-center mb-4">Iniciar sesión con su cuenta</h2>
                                <form id="login-form">
                                    <div class="mb-3">
                                        <label for="email" class="form-label"><b>Correo electrónico</b></label>
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Ingresar correo electrónico" required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="pass" class="form-label"><b>Contraseña</b></label>
                                        <input type="password" class="form-control" id="pass" name="pass" placeholder="Ingresar contraseña" required>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
                                    </div>
                                    <p class="text-center mt-3 mb-0"><a href="#" id="show-registro">¿No tiene una cuenta? Cree una aquí</a></p>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Formulario de Registro -->
        <section id="registro" class="registro py-3" style="display: none;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="card shadow-sm border">
                            <div class="card-body p-4 p-md-4">
                                <h2 class="card-title text-center mb-3">Crear una cuenta</h2>

                                <form id="registro-form">
                                    <div class="mb-3">
                                        <label for="run" class="form-label"><b>RUN (sin dígito verificador)</b></label>
                                        <input type="text" class="form-control" id="run" name="run" placeholder="Ingresar RUN" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="nombre" class="form-label"><b>Nombre</b></label>
                                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ingresar nombre" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="apellidos" class="form-label"><b>Apellidos</b></label>
                                        <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Ingresar apellidos" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="email-registro" class="form-label"><b>Correo electrónico</b></label>
                                        <input type="email" class="form-control" id="email-registro" name="email" placeholder="Ingresar correo electrónico" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="fecha-nacimiento" class="form-label"><b>Fecha de nacimiento</b></label>
                                        <input type="date" class="form-control" id="fecha-nacimiento" name="fecha-nacimiento" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="comuna" class="form-label"><b>Comuna</b></label>
                                        <input type="text" class="form-control" id="comuna" name="comuna" placeholder="Ingresar comuna" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="direccion" class="form-label"><b>Dirección</b></label>
                                        <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ingresar dirección" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="pass-registro" class="form-label"><b>Contraseña</b></label>
                                        <input type="password" class="form-control" id="pass-registro" name="pass" placeholder="Ingresar contraseña" required>
                                    </div>

                                    <div class="mb-4">
                                        <label for="pass2-registro" class="form-label"><b>Confirmar contraseña</b></label>
                                        <input type="password" class="form-control" id="pass2-registro" name="pass2" placeholder="Confirmar contraseña" required>
                                    </div>

                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-success">Registrar</button>
                                    </div>
                                    <p class="text-center mt-3 mb-0"><a href="#" id="show-login">¿Ya tiene una cuenta? Inicie sesión</a></p>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer py-3"><p>© Veterinaria San Marcos 2026. Todos los derechos reservados.</p></footer>

    <script src="js/login.js"></script>
</body>
</html>
