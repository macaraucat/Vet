<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Veterinaria San Marcos</title>
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/tienda.css">
</head>
<body>

    <header class="py-3">
        <div class="container">
            <div class="header d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <a href="index.html"><img src="img/logo.png" alt="Logo Veterinaria San Marcos" class="logo"></a>
                    <nav class="d-flex align-items-center gap-3">
                        <a href="catalogo.html">Productos</a>
                        <a href="index.html#nosotros">Nosotros</a>
                        <a href="index.html#blogs">Blogs</a>
                        <a href="index.html#contacto">Contacto</a>
                    </nav>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span id="user-name-display" class="user-name"></span>
                    <a href="login.html" id="btn-login" title="Iniciar sesión"><img src="img/cuenta.svg" alt="Iniciar sesión" class="icon"></a>
                    <a href="#" id="btn-logout" title="Cerrar sesión" style="display: none;"><img src="img/logout.svg" alt="Cerrar sesión" class="icon"></a>
                    <a href="carrito.html" title="Carrito" class="position-relative">
                        <img src="img/carrito.svg" alt="Carrito" class="icon">
                        <span id="contador-carrito" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <main class="container mb-5">
        <h2 class="text-center mb-4">Tu carrito de compras</h2>

        <div id="carrito-vacio" class="text-center d-none">
            <p>Tu carrito está vacío.</p>
            <a href="catalogo.html" class="btn btn-success">Ir al catálogo</a>
        </div>

        <table class="table align-middle d-none" id="tabla-carrito">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="items-carrito">
            </tbody>
        </table>

        <div class="text-end d-none" id="resumen-carrito">
            <h4>Total: $<span id="total-carrito">0</span></h4>
            <button class="btn btn-outline-danger" onclick="limpiarCarrito()">Vaciar carrito</button>
            <button class="btn btn-success" onclick="finalizarCompra()">Finalizar compra</button>
        </div>

        <div id="pedido-confirmado" class="alert alert-success text-center mt-4 d-none" role="alert"></div>
    </main>

    <footer class="footer py-3">
        <div class="container">
            <p class="text-center">© Veterinaria San Marcos 2026. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/carrito.js"></script>

</body>
</html>
